name: Generate Realistic Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Realistic Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mastzy
          outputs: |
            dist/github-contribution-grid-snake.svg
          # Tambahan realisme: kecepatan dan warna
          snake_color: '#4CAF50'         # hijau alami
          background_color: '#0d1117'    # gelap modern
          color_snake_head: '#A2FF00'    # kepala lebih terang
          speed: 5                       # lebih lambat, seperti ular beneran

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
